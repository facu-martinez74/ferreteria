<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferretería El Clavo</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="logo" href="/">🔧 <span>Ferretería <b>El Clavo</b></span></a>
      <button id="btn-carrito" class="btn-carrito" aria-label="Abrir carrito">
        🛒 <span>Mi pedido</span> <span id="carrito-cant" class="badge">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>Todo para tu obra, <em>sin esperar.</em></h1>
      <p>Buscá lo que necesitás, armá tu pedido y retiralo por el local.</p>
      <input id="buscador" type="search" placeholder="Buscá por producto o por lo que querés hacer: &quot;colgar un cuadro&quot;, &quot;pintar&quot;…" autocomplete="off">
    </div>
  </section>

  <main class="wrap">
    <div id="chips" class="chips"></div>
    <p id="resumen" class="resumen"></p>
    <div id="grilla" class="grilla"></div>
  </main>

  <div id="velo" class="velo" hidden></div>

  <aside id="panel" class="panel" aria-hidden="true">
    <div class="panel-cab">
      <h2>Mi pedido</h2>
      <button id="cerrar-panel" class="cerrar" aria-label="Cerrar">✕</button>
    </div>
    <div id="lineas" class="lineas"></div>
    <div class="panel-pie">
      <div class="total-fila"><span>Total</span><strong id="total">$0</strong></div>
      <button id="btn-confirmar" class="btn primario" disabled>Continuar</button>
    </div>
  </aside>

  <div id="modal" class="modal" hidden>
    <div class="modal-caja">
      <form id="form-pedido">
        <h2>Confirmá tu pedido</h2>
        <p class="sub">Te lo preparamos para retirar. Te avisamos al teléfono cuando esté listo.</p>
        <label>Tu nombre
          <input name="cliente" required minlength="2" maxlength="80" autocomplete="name">
        </label>
        <label>Teléfono / WhatsApp
          <input name="telefono" required inputmode="tel" maxlength="40" autocomplete="tel">
        </label>
        <label>Notas (opcional)
          <textarea name="notas" rows="2" maxlength="500" placeholder="Ej: lo retiro después de las 18"></textarea>
        </label>
        <p id="form-error" class="error" hidden></p>
        <div class="modal-acc">
          <button type="button" id="btn-cancelar" class="btn">Volver</button>
          <button type="submit" id="btn-enviar" class="btn primario">Enviar pedido</button>
        </div>
      </form>
      <div id="exito" hidden>
        <div class="check">✓</div>
        <h2>¡Pedido recibido!</h2>
        <p id="exito-texto"></p>
        <button id="btn-cerrar-exito" class="btn primario">Seguir mirando</button>
      </div>
    </div>
  </div>

  <footer class="wrap" style="padding:30px 16px 40px;text-align:center;color:#9ca3af;font-size:.85rem">
    Ferretería El Clavo · <a href="/admin" style="color:inherit">Acceso del negocio</a>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
